*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overscroll-behavior:none}
body{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#faf3e6 0%,var(--paper) 55%,#ecdcc3 100%)}
.app{width:100%;max-width:480px;position:relative;padding-bottom:22px;user-select:none;-webkit-user-select:none}
.ttl{text-align:center;padding:14px 8px 0;position:relative;z-index:2;line-height:1.1}
.ttl .s{font-size:clamp(17px,5vw,24px);font-weight:900;color:#4f6b45;letter-spacing:.04em}
.ttl .m{font-size:clamp(30px,9.5vw,46px);font-weight:900;color:#7a4a2a;letter-spacing:.08em;text-shadow:0 2px 0 #fff6e6}
.header{position:relative;width:100%;aspect-ratio:1199/800;background:url(../img/natural/gheader.webp) center/cover no-repeat;margin-top:-8px;cursor:pointer}
.header::before{display:none;content:"";position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(var(--paper),transparent)}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--paper))}
.bubble{position:absolute;top:6%;z-index:5;background:#fffdf7;border:2px solid #e2cba8;border-radius:16px;padding:6px 12px;font-size:clamp(12px,3.4vw,15px);font-weight:700;
  white-space:nowrap;box-shadow:0 4px 10px rgba(90,61,43,.18);opacity:0;transform:translateY(8px) scale(.85);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;bottom:-9px;width:14px;height:14px;background:#fffdf7;border-right:2px solid #e2cba8;border-bottom:2px solid #e2cba8;transform:rotate(45deg)}
#bubB{left:6%}#bubB::after{right:22%}#bubW{right:5%}#bubW::after{left:22%}
.scores{display:flex;gap:10px;padding:0 12px;margin-top:-4%;position:relative;z-index:3}
.score{flex:1;display:flex;align-items:center;gap:8px;background:linear-gradient(#fffaf0,#f5ead6);border:2px solid #eadbc2;border-radius:18px;padding:7px 10px;
  box-shadow:0 3px 8px rgba(90,61,43,.13);transition:transform .25s,box-shadow .25s,border-color .25s;min-width:0}
.score.active{border-color:#b9cfa7;box-shadow:0 0 0 3px rgba(125,160,105,.35),0 4px 10px rgba(90,61,43,.18);transform:translateY(-2px)}
.score .av{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;flex:none;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.score .nm{font-weight:900;font-size:clamp(14px,4vw,17px);flex:1;white-space:nowrap;min-width:0}
.score .nm small{display:block;font-size:10px;font-weight:700;color:#9a8068;margin-top:-1px}
.score .ct{font-weight:900;font-size:clamp(18px,5.4vw,24px);border-left:2px solid #d9c6a8;padding-left:9px;min-width:36px;text-align:right;font-family:Georgia,serif}
.status{margin:12px auto 0;width:84%;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#fbf4e7,#f1e3cc);border:2px solid #e3cfb0;border-radius:30px;
  padding:8px 14px;font-weight:900;font-size:clamp(14px,4.4vw,19px);letter-spacing:.04em;box-shadow:0 2px 6px rgba(90,61,43,.1);min-height:46px;text-align:center}
.status.think .txt::after{content:"";display:inline-block;animation:dots 1.2s steps(4) infinite;width:1.4em;text-align:left}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 12px 0}
.btn{border:none;border-radius:22px;padding:11px 4px;font:inherit;font-weight:900;font-size:clamp(12px,3.6vw,15px);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
  transition:transform .1s,filter .2s;box-shadow:0 3px 6px rgba(60,40,25,.22),inset 0 1px 0 rgba(255,255,255,.3);color:var(--ink)}
.btn:active{transform:scale(.95)}
.btn.g{background:linear-gradient(#6c8a60,var(--green-d));color:#fff}
.btn.c{background:linear-gradient(#fffaf1,#efe2cb);border:2px solid #e2cfb2}
.btn:disabled{filter:grayscale(.6) opacity(.5);cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;margin:12px 18px 0;font-size:12px;color:#9a8068;font-weight:700;gap:8px}
.modal{position:fixed;inset:0;background:rgba(70,48,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.card{width:100%;max-width:400px;background:var(--cream);border-radius:24px;border:3px solid #e6d2b2;padding:20px 18px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.4,.4,1);max-height:92vh;overflow:auto}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.card h2{margin:0 0 14px;text-align:center;font-size:21px;font-weight:900;color:var(--green-d)}
.row{margin-bottom:14px}.row .lb{font-size:13px;font-weight:900;color:var(--ink2);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:2px solid #e2cfb2;background:#fff;border-radius:14px;padding:9px 4px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.4}
.seg button.on{background:var(--green);border-color:var(--green-d);color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-top:1px dashed #e3d3ba;font-weight:700;font-size:14px}
.sw{width:48px;height:28px;border-radius:20px;background:#d8cbb6;position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--green)}.sw.on::after{left:23px}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1;padding:12px}
.help p{font-size:13.5px;line-height:1.75;margin:0 0 8px}
.result{text-align:center}
.result .avs{display:flex;justify-content:center;gap:18px;margin:6px 0 10px}
.result .avs>div{text-align:center;font-weight:900;font-size:14px}
.result .avs .ph{width:88px;height:88px;border-radius:50%;background-size:cover;background-position:center;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.18);margin:0 auto 4px;transition:transform .3s}
.result .avs .win .ph{border-color:#f0c35a;transform:scale(1.08)}.result .avs .lose .ph{filter:grayscale(.45);opacity:.8}
.result .crown{font-size:26px;height:30px}
.result .big{font-size:30px;font-weight:900;font-family:Georgia,serif;margin:2px 0}
.result .msg{font-size:18px;font-weight:900;color:var(--green-d);margin-bottom:6px}
.rec{font-size:12px;color:#8d735b;margin-top:6px;line-height:1.6}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);background:rgba(74,99,66,.95);color:#fff;font-weight:900;font-size:clamp(15px,4.6vw,21px);padding:12px 22px;border-radius:22px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:88vw;width:max-content;text-align:center;line-height:1.45}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.red{background:rgba(176,68,52,.95)}
.fx{position:fixed;pointer-events:none;z-index:45;font-size:22px;animation:fly 1.4s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1);opacity:0}}

.panel{margin:10px 6px 0;padding:6px;border-radius:18px;background:linear-gradient(145deg,#ecd3ad,var(--wood) 40%,var(--wood-d));box-shadow:0 8px 20px rgba(90,61,43,.25),inset 0 2px 0 rgba(255,255,255,.5)}
.panel .in{border-radius:13px;background:linear-gradient(#fffaf0,#f3e6cf);box-shadow:inset 0 2px 8px rgba(90,61,43,.18);position:relative;overflow:hidden}
.hud{display:flex;gap:6px;margin:-2% 10px 0;position:relative;z-index:3}
.hud .box{flex:1;background:linear-gradient(#fffaf0,#f5ead6);border:2px solid #eadbc2;border-radius:14px;padding:4px 6px;text-align:center;box-shadow:0 3px 8px rgba(90,61,43,.13);min-width:0}
.hud .box small{display:block;font-size:10px;color:#9a8068;font-weight:700}
.hud .box b{font-size:clamp(14px,4.6vw,19px);white-space:nowrap}
body:is([data-vt=retro],[data-vt=neon]) .hud .box{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.25);color:inherit}
body:is([data-vt=retro],[data-vt=neon]) .hud .box small{color:inherit;opacity:.75}
.gbtns{margin-top:10px}
.gbtns .btn{font-size:clamp(11px,3.3vw,14px);padding:11px 2px}
.lvRow{display:flex;gap:6px;margin:8px 10px 0;overflow-x:auto;scrollbar-width:none}
.lvRow::-webkit-scrollbar{display:none}
.lvRow button{flex:1 0 auto;border:2px solid #e2cfb2;background:#fffaf1;border-radius:14px;padding:7px 10px;font:inherit;font-weight:900;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.lvRow button.on{background:linear-gradient(#6c8a60,var(--green-d));color:#fff;border-color:transparent}
.lvRow button i{font-style:normal;color:#f0b429;margin-left:2px;font-size:11px}
body[data-vt=retro] .lvRow button{background:#3a160a;color:#ffd36b;border-color:#a8651e}body[data-vt=retro] .lvRow button.on{background:linear-gradient(#d0452f,#8f2a1f);border-color:#f2b134;color:#ffe7b0}
body[data-vt=neon] .lvRow button{background:rgba(20,8,55,.85);color:#fff;border-color:#5a3bb0}body[data-vt=neon] .lvRow button.on{border-color:#ff4fd8;box-shadow:0 0 10px #ff4fd8;background:rgba(255,79,216,.3)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin:10px auto 0}
.pad button{border:none;border-radius:16px;font-size:24px;font-weight:900;background:linear-gradient(#fffaf1,#efe2cb);border:2px solid #e2cfb2;box-shadow:0 3px 6px rgba(60,40,25,.22);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button:active{transform:scale(.92);filter:brightness(.95)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}.pad .c{grid-column:2;grid-row:2;font-size:13px}
body[data-vt=retro] .pad button{background:linear-gradient(#d0452f,#8f2a1f);color:#ffe7b0;border-color:#f2b134}
body[data-vt=neon] .pad button{background:rgba(20,8,55,.85);color:#3ff0ff;border:1.5px solid #3ff0ff;box-shadow:0 0 10px rgba(63,240,255,.5)}
.dog{border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.35)}
.dog.c{background-image:var(--colon)}.dog.m{background-image:var(--moon)}
.help p{font-size:14px;line-height:1.65;margin:0 0 8px}

#bd{display:grid;margin:6px auto;gap:0;touch-action:none}
.ce{position:relative;aspect-ratio:1}
.ce.w{background:linear-gradient(135deg,#b07a4a,#8a5a2c);border-radius:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.2)}
.ce.f{background:#f6ead2}
.ce.g::after{content:"🐾";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(5vw,22px);opacity:.45}
.ob{position:absolute;inset:6%;transition:transform .12s}
.bx{border-radius:7px;background:linear-gradient(#e7b56a,#c88a3e);box-shadow:inset 0 0 0 3px #8a5a2c,0 2px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:min(5vw,22px)}
.bx.ok{background:linear-gradient(#9fd08a,#5d9a4c);box-shadow:inset 0 0 0 3px #3d6a30,0 0 8px #ffe066}
.pl{inset:4%}
body[data-vt=retro] .ce.f{background:#4a2a14}body[data-vt=retro] .ce.w{background:linear-gradient(135deg,#8f2a1f,#5a1a10);box-shadow:inset 0 0 0 2px #f2b134}
body[data-vt=neon] .ce.f{background:#140a3a}body[data-vt=neon] .ce.w{background:#2a1a6a;box-shadow:inset 0 0 0 1.5px #3ff0ff,0 0 6px rgba(63,240,255,.5)}
body[data-vt=neon] .ce.g::after{filter:drop-shadow(0 0 4px #ff4fd8)}
body[data-vt=retro] .pkRow button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25);color:#fbe9c8}body[data-vt=retro] .pkRow button.on{border-color:#f2b134;background:rgba(192,57,43,.45);box-shadow:0 0 10px rgba(255,154,46,.6)}
body[data-vt=neon] .pkRow button{background:rgba(255,255,255,.06);border-color:#5a3bb0;color:#fff}body[data-vt=neon] .pkRow button.on{border-color:#ff4fd8;background:rgba(255,79,216,.25);box-shadow:0 0 12px #ff4fd8}

/* header chips (same as hub) */
.app .vtBtn,.app .homeBtn{position:absolute;top:8px;bottom:auto;width:auto;height:auto;flex-direction:row;gap:3px;border:2px solid rgba(255,255,255,.75)!important;border-radius:16px;padding:5px 10px;font-size:12px!important;font-weight:900;background:rgba(0,0,0,.45)!important;color:#fff!important;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.3);line-height:1.2;text-decoration:none;white-space:nowrap;z-index:6}
.app .vtBtn{right:8px;left:auto}.header .homeBtn{left:8px;right:auto}
.app .vtBtn:active,.app .homeBtn:active{transform:scale(.92)}
body[data-vt=retro] .sw{background:#3a160a;box-shadow:inset 0 0 0 2px #a8651e}body[data-vt=retro] .sw::after{background:#e0b98a}
body[data-vt=retro] .sw.on{background:linear-gradient(#d0452f,#8f2a1f);box-shadow:inset 0 0 0 2px #f2b134,0 0 10px rgba(255,154,46,.5)}body[data-vt=retro] .sw.on::after{background:#ffe7b0}
body[data-vt=neon] .sw{background:rgba(20,8,55,.9);box-shadow:inset 0 0 0 1.5px #5a3bb0}body[data-vt=neon] .sw::after{background:#8f7fd0;box-shadow:none}
body[data-vt=neon] .sw.on{background:rgba(255,79,216,.35);box-shadow:inset 0 0 0 1.5px #ff4fd8,0 0 10px #ff4fd8}body[data-vt=neon] .sw.on::after{background:#fff;box-shadow:0 0 8px #ff4fd8}

#bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center top}
.vtBtn{position:absolute;right:8px;top:8px;z-index:30;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);color:#fff;font:inherit;font-size:8.5px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
.homeBtn{font-size:8.5px!important;white-space:nowrap}
.vtBtn:active{transform:scale(.92)}
.bubble{color:#5a3d2b!important}
.gTitle{display:none;position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:4;white-space:nowrap;pointer-events:none;padding:2px 22px 4px;border-radius:16px;font-size:clamp(17px,5.2vw,24px)}
/* NATURAL */
body[data-vt=natural]{background:none}
body[data-vt=natural] #bgLayer{background-image:linear-gradient(rgba(248,244,232,.45),rgba(248,244,232,.82)),url(../img/natural/bg.webp)}
body[data-vt=natural] .card{background:linear-gradient(rgba(251,246,236,.5),rgba(251,246,236,.5)),url(../img/natural/bg_modal.webp) center/cover;border-color:#c9a06a}
body[data-vt=natural] .btn.g,body[data-vt=natural] .btn.c{background:linear-gradient(#fbf0dc,#ecd5ae);color:#5a3d2b;border:2px solid #b98a52;box-shadow:0 3px 0 #9a6b3a,0 5px 8px rgba(90,61,43,.2)}
body[data-vt=natural] .btn.g{background:linear-gradient(#7d9a6e,#56705A);color:#fff;border-color:#3f5541;box-shadow:0 3px 0 #33463a,0 5px 8px rgba(60,80,50,.25)}
body[data-vt=natural] :is(.boardWrap,.panel,.frame){background:linear-gradient(145deg,#d8a96a,#b9864a 45%,#8f5f30)}
/* SHARED DARK */
body:is([data-vt=retro],[data-vt=neon]) .ttl{display:none}
body:is([data-vt=retro],[data-vt=neon]) .header{aspect-ratio:1199/800;margin-top:0}
body:is([data-vt=retro],[data-vt=neon]) .header::before{display:none}
body:is([data-vt=retro],[data-vt=neon]) .gTitle{display:block}
body:is([data-vt=retro],[data-vt=neon]) .bubble{top:36%}
body:is([data-vt=retro],[data-vt=neon]) .card{color:inherit}
body:is([data-vt=retro],[data-vt=neon]) :is(.lb,.rec,.subTitle,.help p,.note,.soloBox,.lastBox,.exitLbl){color:inherit!important;opacity:.9}
body:is([data-vt=retro],[data-vt=neon]) .seg button{background:rgba(255,255,255,.08);color:inherit;border-color:rgba(255,255,255,.25)}
body:is([data-vt=retro],[data-vt=neon]) .tg{border-color:rgba(255,255,255,.2)}
body:is([data-vt=retro],[data-vt=neon]) :is(.stb,.prs button,.legend div,.quick button,.sizes button){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:inherit}
body:is([data-vt=retro],[data-vt=neon]) :is(.stb small,.score .nm small,.hud .box small){color:inherit;opacity:.8}
body:is([data-vt=retro],[data-vt=neon]) .handRow{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.25)}
body:is([data-vt=retro],[data-vt=neon]) .handRow :is(.lbl,.none){color:inherit;opacity:.8}
/* RETRO */
body[data-vt=retro]{--paper:#2a1208;--ink:#fbe9c8;--ink2:#ffd36b;background:#2a1208;color:#fbe9c8}
body[data-vt=retro] #bgLayer{background-image:linear-gradient(rgba(25,8,2,.45),rgba(25,8,2,.82)),url(../img/retro/bg.webp)}
body[data-vt=retro] .header{background-image:url(../img/retro/gheader.webp)!important}
body[data-vt=retro] .header::after{background:linear-gradient(transparent,#2a1208)}
body[data-vt=retro] .gTitle{font-family:"Mochiy Pop One",sans-serif;color:#ffe7b0;letter-spacing:.08em;text-shadow:0 0 10px #ff9a2e,0 3px 0 #8f2a1f;background:linear-gradient(#8f2a1f,#5a1a10);border:3px solid #f2b134;box-shadow:0 0 14px rgba(255,154,46,.6)}
body[data-vt=retro] :is(.score,.hud .box){background:linear-gradient(#5a2412,#3a160a);border:3px solid #f2b134;color:#fbe9c8;box-shadow:0 0 0 2px #7a2a10,0 0 12px rgba(255,154,46,.3)}
body[data-vt=retro] .score.active{box-shadow:0 0 0 2px #7a2a10,0 0 22px rgba(255,190,80,.85)}
body[data-vt=retro] :is(.score .ct,.hud .box b){color:#ffd36b;border-color:#a8651e}
body[data-vt=retro] .status{background:linear-gradient(#5a2412,#3a160a);border:3px solid #f2b134;color:#ffd36b;font-family:"Mochiy Pop One",sans-serif;font-weight:400;box-shadow:0 0 14px rgba(255,154,46,.35)}
body[data-vt=retro] :is(.btn.g,.btn.c){background:linear-gradient(#d0452f,#8f2a1f);color:#ffe7b0;border:2px solid #f2b134;box-shadow:0 4px 0 #4a1408,0 0 10px rgba(255,154,46,.3);font-family:"Mochiy Pop One",sans-serif;font-weight:400}
body[data-vt=retro] .foot{color:#e0b98a}body[data-vt=retro] .foot b{color:#ffd36b}
body[data-vt=retro] :is(.boardWrap,.panel,.frame){background:linear-gradient(#8a2a1d,#55190f);border:3px solid #f2b134;box-shadow:0 0 0 3px #5a1a10,0 0 14px rgba(255,154,46,.3)}
body[data-vt=retro] .card{background:linear-gradient(rgba(42,18,8,.9),rgba(42,18,8,.94)),url(../img/retro/bg_modal.webp) center/cover;border:3px solid #f2b134;color:#fbe9c8;box-shadow:0 0 20px rgba(255,154,46,.5)}
body[data-vt=retro] .card h2{color:#ffd36b;font-family:"Mochiy Pop One";font-weight:400}
body[data-vt=retro] .seg button.on{background:#c0392b;border-color:#f2b134;color:#fff}
body[data-vt=retro] .result .msg{color:#ffd36b}
/* NEON */
body[data-vt=neon]{--paper:#0d0626;--ink:#fff;--ink2:#c9b8ff;background:#0d0626;color:#fff}
body[data-vt=neon] #bgLayer{background-image:linear-gradient(rgba(10,4,35,.35),rgba(10,4,35,.8)),url(../img/neon/bg.webp)}
body[data-vt=neon] .header{background-image:url(../img/neon/gheader.webp)!important}
body[data-vt=neon] .header::after{background:linear-gradient(transparent,#0d0626)}
body[data-vt=neon] .gTitle{font-family:"DotGothic16",monospace;color:#fff;letter-spacing:.12em;text-shadow:0 0 6px #fff,0 0 14px #ff4fd8;background:rgba(13,6,38,.82);border:2px solid #ff4fd8;box-shadow:0 0 14px #ff4fd8,inset 0 0 10px rgba(255,79,216,.4)}
body[data-vt=neon] :is(.score,.hud .box){background:rgba(20,8,55,.82);border:1.5px solid #3ff0ff;color:#fff;box-shadow:0 0 10px rgba(63,240,255,.45),inset 0 0 10px rgba(63,240,255,.15)}
body[data-vt=neon] .score.active{border-color:#ff4fd8;box-shadow:0 0 16px #ff4fd8,inset 0 0 12px rgba(255,79,216,.3)}
body[data-vt=neon] :is(.score .ct,.hud .box b){font-family:"DotGothic16",monospace;font-weight:400;text-shadow:0 0 8px #3ff0ff;border-color:#5a3bb0}
body[data-vt=neon] .status{background:rgba(20,8,55,.85);border:1.5px solid #ff4fd8;color:#fff;font-family:"DotGothic16",monospace;font-weight:400;text-shadow:0 0 8px #ff4fd8;box-shadow:0 0 14px rgba(255,79,216,.5)}
body[data-vt=neon] :is(.btn.g,.btn.c){background:rgba(20,8,55,.85);color:#fff;border:1.5px solid #3ff0ff;box-shadow:0 0 10px rgba(63,240,255,.5),inset 0 0 8px rgba(63,240,255,.2);text-shadow:0 0 6px #3ff0ff}
body[data-vt=neon] .btn.g{border-color:#ff4fd8;box-shadow:0 0 10px rgba(255,79,216,.55),inset 0 0 8px rgba(255,79,216,.25);text-shadow:0 0 6px #ff4fd8}
body[data-vt=neon] .foot{color:#c9b8ff}body[data-vt=neon] .foot b{color:#fff}
body[data-vt=neon] :is(.boardWrap,.panel,.frame){background:rgba(10,4,35,.65);border:2px solid #ff4fd8;box-shadow:0 0 16px #ff4fd8,0 0 34px rgba(63,240,255,.3),inset 0 0 16px rgba(255,79,216,.3)}
body[data-vt=neon] .card{background:linear-gradient(rgba(13,6,38,.86),rgba(13,6,38,.92)),url(../img/neon/bg_modal.webp) center/cover;border:1.5px solid #3ff0ff;color:#fff;box-shadow:0 0 22px rgba(255,79,216,.5)}
body[data-vt=neon] .card h2{color:#fff;font-family:"DotGothic16";font-weight:400;text-shadow:0 0 8px #ff4fd8}
body[data-vt=neon] .seg button.on{background:#ff4fd8;border-color:#fff;color:#fff;box-shadow:0 0 10px #ff4fd8}
body[data-vt=neon] .result .msg{color:#3ff0ff;text-shadow:0 0 8px #3ff0ff}

/* ---- game specific ---- */
body:is([data-vt=retro],[data-vt=neon]) .panel .in{background:rgba(0,0,0,.35);box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
body:is([data-vt=retro],[data-vt=neon]) .rule{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.25);color:inherit}
body[data-vt=retro] .felt{background:radial-gradient(circle at 40% 30%,#216a58,#1a5546 50%,#123d33);box-shadow:inset 0 0 0 3px #f2b134,inset 0 4px 14px rgba(0,0,0,.5)}
body[data-vt=neon] .felt{background:#0f0730;box-shadow:inset 0 0 20px rgba(63,240,255,.3)}
body[data-vt=retro] .cardx .bk{background:linear-gradient(135deg,#c0392b,#7a1f14);border-color:#f2b134}
body[data-vt=neon] .cardx .bk{background:linear-gradient(135deg,#3a1a8a,#160a45);border:2px solid #ff4fd8;box-shadow:0 0 10px rgba(255,79,216,.6)}
body[data-vt=neon] .cardx .fr{box-shadow:0 0 10px #3ff0ff}
body[data-vt=neon] #board{box-shadow:0 0 12px #3ff0ff,inset 0 0 12px rgba(120,70,20,.25)}
body[data-vt=neon] :is(#files,#ranks) span{color:#3ff0ff}
body[data-vt=retro] :is(#files,#ranks) span{color:#ffd36b}
body[data-vt=neon] .sq{background:#160a45!important;box-shadow:inset 0 0 0 1.5px rgba(63,240,255,.6)}
body[data-vt=neon] .sq.sel{box-shadow:inset 0 0 0 3px #ff4fd8,0 0 10px #ff4fd8}
body[data-vt=retro] .sq{filter:saturate(.8) brightness(.85)}
body[data-vt=neon] #gb{background:#0f0730;box-shadow:inset 0 0 18px rgba(63,240,255,.3)}
body[data-vt=neon] .lines line{stroke:#3ff0ff;stroke-opacity:.7}
body[data-vt=neon] .lines .edge{stroke:#ff4fd8}
body[data-vt=neon] .lines circle{fill:#ff4fd8}
body[data-vt=neon] .st.B{background:radial-gradient(circle at 35% 30%,#ffd0f4,#ff4fd8 45%,#8a1a78);box-shadow:0 0 10px #ff4fd8}
body[data-vt=neon] .st.W{background:radial-gradient(circle at 35% 30%,#fff,#bdf8ff 45%,#2fb8d8);box-shadow:0 0 10px #3ff0ff}

<script>(()=>{
const PK={dog:'colon',order:'first'};
function askPick(onGo,o){ o=o||{};
  let m=$('mPick');
  if(!m){ m=document.createElement('div'); m.className='modal'; m.id='mPick';
    m.innerHTML=`<div class="card pick"><h2>🐾 どっちで遊ぶ？</h2><div class="lb" id="pkL1">あなたのワンコ</div>
    <div class="pkRow" data-pk="dog"><button data-v="colon"><span class="pa" style="background-image:var(--colon)"></span>コロン</button><button data-v="moon"><span class="pa" style="background-image:var(--moon)"></span>ムーン</button></div>
    <div class="lb">順番</div><div class="pkRow" data-pk="order"><button data-v="first">⚡ 先手<small>先にはじめる</small></button><button data-v="second">🐢 後手<small>あとからはじめる</small></button></div>
    <div class="pkNote" id="pkNote"></div><div class="acts"><button class="btn g" id="bPickGo">この順番ではじめる！</button></div></div>`;
    document.body.appendChild(m);
    m.querySelectorAll('.pkRow button').forEach(b=>b.onclick=()=>{ try{SFX.tap()}catch(e){} PK[b.parentElement.dataset.pk]=b.dataset.v; pkSync(); });
  }
  m._go=onGo; m._pvp=!!o.pvp; PK.dog=o.dog||PK.dog; PK.order=o.order||PK.order;
  $('pkL1').textContent=o.pvp?'プレイヤー1のワンコ':'あなたのワンコ';
  $('bPickGo').onclick=()=>{ try{SFX.tap()}catch(e){} closeM('mPick'); m._go&&m._go(PK.dog,PK.order); };
  pkSync(); openM('mPick');
}
function pkSync(){ const m=$('mPick'); m.querySelectorAll('.pkRow').forEach(r=>r.querySelectorAll('button').forEach(b=>b.classList.toggle('on',PK[r.dataset.pk]===b.dataset.v)));
  const me=PK.dog==='colon'?'コロン':'ムーン', ot=PK.dog==='colon'?'ムーン':'コロン';
  $('pkNote').textContent=(PK.order==='first'?me:ot)+'が先にはじめるよ'; }

const $=id=>document.getElementById(id);
const pick=a=>a[(Math.random()*a.length)|0];
const mkStore=pre=>({get(k,d){try{const v=localStorage.getItem(pre+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(pre+k,JSON.stringify(v))}catch(e){}}});
let ac=null; const SND={on:true};
function actx(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==='suspended')ac.resume().catch(()=>{}); return ac }
function tone(f,t0,dur,type='sine',vol=.18,f2){ const a=actx(); if(!a||!SND.on) return;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; const s=a.currentTime+t0; o.frequency.setValueAtTime(f,s); if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.01); g.gain.exponentialRampToValueAtTime(.001,s+dur); o.connect(g).connect(a.destination); o.start(s); o.stop(s+dur+.02); }
function bark(p,t0=0){ const a=actx(); if(!a||!SND.on) return; const base=p===1?520:700;
  const o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter(); o.type='sawtooth'; fl.type='bandpass'; fl.frequency.value=base*1.6; fl.Q.value=2; const s=a.currentTime+t0;
  o.frequency.setValueAtTime(base,s); o.frequency.linearRampToValueAtTime(base*1.35,s+.04); o.frequency.exponentialRampToValueAtTime(base*.55,s+.16);
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.35,s+.015); g.gain.exponentialRampToValueAtTime(.001,s+.18); o.connect(fl).connect(g).connect(a.destination); o.start(s); o.stop(s+.2); }
const SFX={tap(){tone(700,0,.05,'sine',.08)},put(){tone(330,0,.09,'triangle',.25);tone(165,0,.06,'sine',.2)},
  win(){[523,659,784,1047].forEach((f,k)=>tone(f,k*.13,.25,'triangle',.2))},lose(){[392,349,311].forEach((f,k)=>tone(f,k*.18,.3,'triangle',.16))},
  ok(){[784,988].forEach((f,k)=>tone(f,k*.08,.14,'triangle',.15))},ng(){tone(220,0,.18,'triangle',.12)},alarm(){[880,660,880].forEach((f,k)=>tone(f,k*.12,.1,'square',.06))}};
const TALK={on:true}, bt={};
const PAT={1:['えへへ〜','もっとなでて！','くすぐったいワン','しっぽフリフリ','わんっ！'],2:['ふわふわでしょ♪','きもちいい〜','もっと〜','わふっ','おさんぽ行きたい！']};
function sayText(p,t,force){ if(!TALK.on&&!force) return; const key=p===1?'B':'W', el=$('bub'+key); el.textContent=t; el.classList.add('show');
  clearTimeout(bt[key]); bt[key]=setTimeout(()=>el.classList.remove('show'),1900); }
let _tt; function toast(t,red){const el=$('toast');el.textContent=t;el.classList.toggle('red',!!red);el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),1100)}
function burstAt(x,y,items=['🐾','✨'],n=8,dist=70){ for(let k=0;k<n;k++){const s=document.createElement('div');s.className='fx';s.textContent=items[k%items.length];
  s.style.left=(x-11)+'px';s.style.top=(y-11)+'px';const a=k/n*Math.PI*2;s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist+'px');s.style.setProperty('--r',(Math.random()*90-45)+'deg');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1400)} }
function burstEl(el,items,n){const r=el.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,items,n)}
function confetti(items){ for(let k=0;k<26;k++){const s=document.createElement('div');s.className='fx';s.textContent=pick(items);s.style.left=(Math.random()*innerWidth)+'px';s.style.top='-30px';
  s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--dy',(innerHeight*.6+Math.random()*200)+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');
  s.style.animationDuration=(1.6+Math.random()*1.2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)} }
function setStatus(t,think){$('statusTxt').textContent=t;$('status').classList.toggle('think',!!think)}
const openM=id=>$(id).classList.add('show'), closeM=id=>$(id).classList.remove('show');
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeM(b.dataset.close)));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));
$('header').addEventListener('click',e=>{actx();const r=e.currentTarget.getBoundingClientRect(),p=(e.clientX-r.left)<r.width/2?1:2;sayText(p,pick(PAT[p]),true);bark(p);
  burstAt(e.clientX,e.clientY,['💕','💗','✨'],4,40)});
// settings helpers: seg & sw bound to object
function bindSettings(root,obj,onChange){
  const sync=()=>{root.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(obj[sg.dataset.k])===b.dataset.v)));
    root.querySelectorAll('.sw').forEach(sw=>sw.classList.toggle('on',!!obj[sw.dataset.k]))};
  root.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{obj[b.parentElement.dataset.k]=b.dataset.v;SFX.tap();sync();onChange&&onChange(b.parentElement.dataset.k)}));
  root.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>{obj[sw.dataset.k]=!obj[sw.dataset.k];SFX.tap();sync();onChange&&onChange(sw.dataset.k)}));
  return sync;
}
function showResult(o){ // o:{winner,title,score,msg,extra,rec}
  $('resTitle').textContent=o.title; $('resScore').textContent=o.score||''; $('resMsg').textContent=o.msg||''; $('resExtra').innerHTML=o.extra||''; $('resRec').textContent=o.rec||'';
  $('avB').className=o.winner===1?'win':(o.winner?'lose':''); $('avW').className=o.winner===2?'win':(o.winner?'lose':'');
  $('avB').querySelector('.crown').textContent=o.winner===1?'👑':''; $('avW').querySelector('.crown').textContent=o.winner===2?'👑':'';
  setTimeout(()=>openM('mRes'),o.delay??900);
}

const GID='sokoban';

const store=mkStore('mc_'+GID+'_');
const S=Object.assign({sound:true,talk:true},store.get('settings',{})); SND.on=S.sound; TALK.on=S.talk;
const syncHelp=bindSettings($('mHelp'),S,()=>{SND.on=S.sound;TALK.on=S.talk;store.set('settings',S)}); syncHelp();
$('bHelp').onclick=()=>{actx();SFX.tap();syncHelp();openM('mHelp')};
$('bHome').onclick=()=>{location.href=$('homeBtn').href};
function report(t,o){try{window.MC&&MC.report(GID,t,o||{})}catch(e){}}
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function swipe(el,cb){ let sx=0,sy=0,on=false; el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;on=true},{passive:true});
  el.addEventListener('touchend',e=>{ if(!on) return; on=false; const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u')); },{passive:true}); }
function keys(cb){ addEventListener('keydown',e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key]; if(k){e.preventDefault();cb(k)}}); }
function lvRow(el,names,cur,starsOf,onPick){ el.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===cur?'on':''}">${n}${starsOf&&starsOf(i)?'<i>'+'★'.repeat(starsOf(i))+'</i>':''}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{actx();SFX.tap();onPick(+b.dataset.i)}); const on=el.querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); }
if(!store.get('seen')){ store.set('seen',1); setTimeout(()=>openM('mHelp'),400); }
const SOKO=[["#####","#@$.#","#####"],["######","#@ $.#","# $. #","######"],["#######","#     #","# $.$ #","#@ .  #","#######"],[" #####","##   #","# $  #","#  #.##","# @$ .#","##  ###"," ####"],["#######","#.  @ #","# $$  #","#.  # #","#######"],["########","#  .   #","# $#$  #","# .@.  #","#  $#  #","#   .$ #","#      #","########"],["  #####","###   #","#.@$  #","### $.#","#.##$ #","# # . ##","#$ *$$.#","#   .  #","########"],["#######","#  .  #","# $#$ #","#. @ .#","# $#$ #","#  .  #","#######"]];


const PAR=[1,4,9,12,14,26,34,41];
const P=Object.assign({cur:0,stars:{}},store.get('prog',{}));
let W,H,g,pl,bx,goals,mv=0,hist=[],done=false;
function load(i){ P.cur=i; store.set('prog',P); const rows=SOKO[i]; H=rows.length; W=Math.max(...rows.map(r=>r.length));
  g=[]; bx=[]; goals=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const c=(rows[y][x]||' '); const k=y*W+x;
    g[k]=c==='#'?'w':'f'; if(c==='@'||c==='+')pl=k; if(c==='$'||c==='*')bx.push(k); if(c==='.'||c==='*'||c==='+')goals.push(k); }
  // outside floor -> empty
  const reach=new Set([pl]),q=[pl]; while(q.length){const k=q.pop();for(const d of [1,-1,W,-W]){const n=k+d;if(n<0||n>=W*H||g[n]==='w'||reach.has(n))continue;if(d===1&&n%W===0||d===-1&&k%W===0)continue;reach.add(n);q.push(n)}}
  for(let k=0;k<W*H;k++) if(g[k]==='f'&&!reach.has(k)) g[k]='x';
  mv=0; hist=[]; done=false; draw(); $('stN').textContent=(i+1)+'/'+SOKO.length; $('best').textContent=PAR[i];
  lvRow($('lvs'),SOKO.map((_,k)=>'ステージ'+(k+1)),i,k=>P.stars[k]||0,load);
  setStatus('箱を🐾の上へ運ぼう'); setTimeout(()=>sayText(1,'よいしょ、がんばるワン！'),300); }
function draw(){ const bd=$('bd'); const cs=Math.min(Math.floor((Math.min(innerWidth,480)-40)/W),46);
  bd.style.gridTemplateColumns=`repeat(${W},${cs}px)`;
  bd.innerHTML=''; for(let k=0;k<W*H;k++){ const e=document.createElement('div'); e.className='ce '+(g[k]==='w'?'w':g[k]==='f'?'f':'')+(goals.includes(k)?' g':'');
    if(bx.includes(k)) e.innerHTML=`<div class="ob bx ${goals.includes(k)?'ok':''}">🦴</div>`;
    if(k===pl) e.innerHTML=`<div class="ob pl dog c"></div>`;
    bd.appendChild(e);} $('mv').textContent=mv; $('bUndo').disabled=!hist.length; $('bNext').style.visibility=done&&P.cur<SOKO.length-1?'visible':'hidden'; }
function step(d){ if(done) return; actx(); const dd={l:-1,r:1,u:-W,d:W}[d]; const n=pl+dd;
  if(g[n]!=='f') {SFX.ng();return;} const bi=bx.indexOf(n);
  if(bi>=0){ const n2=n+dd; if(g[n2]!=='f'||bx.includes(n2)){SFX.ng();return;} hist.push([pl,bx.slice()]); bx[bi]=n2; SFX.put(); }
  else { hist.push([pl,bx.slice()]); SFX.tap(); }
  pl=n; mv++; draw(); check(); }
function check(){ if(!bx.every(b=>goals.includes(b))) return; done=true; const s=mv<=PAR[P.cur]?3:mv<=PAR[P.cur]*1.6?2:1;
  P.stars[P.cur]=Math.max(P.stars[P.cur]||0,s); store.set('prog',P); report('clear',{stars:s}); SFX.win(); confetti(['🦴','🐾','✨']);
  sayText(1,'できたワン！',true); setTimeout(()=>sayText(2,'すごーい♪',true),500); setStatus('クリア！'); draw();
  lvRow($('lvs'),SOKO.map((_,k)=>'ステージ'+(k+1)),P.cur,k=>P.stars[k]||0,load);
  showResult({winner:1,title:'🎉 ステージ'+(P.cur+1)+' クリア！',score:mv+'手',msg:'★'.repeat(s)+'☆'.repeat(3-s),rec:'おすすめ：'+PAR[P.cur]+'手'}); }
$('bAgain').onclick=()=>{closeM('mRes'); load(Math.min(P.cur+1,SOKO.length-1))};
$('bAgain').textContent='つぎのステージ';
$('bNext').onclick=()=>load(P.cur+1);
$('bUndo').onclick=()=>{ if(!hist.length) return; [pl,bx]=hist.pop(); mv--; done=false; SFX.tap(); draw(); };
$('bReset').onclick=()=>{actx();SFX.tap();load(P.cur)};
document.querySelectorAll('.pad [data-d]').forEach(b=>b.onclick=()=>step(b.dataset.d));
swipe($('bd'),step); keys(step); addEventListener('resize',draw);
load(P.cur);

(()=>{const VTS=['natural','retro','neon'],VTN={natural:'ナチュラル',retro:'レトロ',neon:'サイバーネオン'};
const st={get(){try{return localStorage.getItem('mc_vt')}catch(e){return null}},set(v){try{localStorage.setItem('mc_vt',v)}catch(e){}}};
function setVT(v,show){ if(!VTS.includes(v)) v='natural'; document.body.dataset.vt=v; st.set(v);
  const h=document.getElementById('homeBtn'); if(h) h.href='../#'+v;
  try{ if(location.hash.slice(1)!==v) history.replaceState(null,'','#'+v); }catch(e){}
  if(show&&typeof toast==='function') toast('🎨 '+VTN[v]); }
const hv=(location.hash||'').slice(1); setVT(VTS.includes(hv)?hv:st.get());
addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(VTS.includes(h)&&h!==document.body.dataset.vt) setVT(h);});
document.getElementById('vtBtn').addEventListener('click',e=>{e.stopPropagation(); try{actx();SFX.tap()}catch(_){} setVT(VTS[(VTS.indexOf(document.body.dataset.vt)+1)%3],true);});
})();

})();</script><script src="../backup.js"></script><script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("../sw.js").catch(()=>{})</script>

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex"><title>【叩き台】リズムゲーム</title><link rel="stylesheet" href="../lab.css"><style></style></head><body><div class="wrap"><div class="top"><a href="../">ラボ</a><h1>リズムゲーム <span class="tag">叩き台</span></h1></div><div class="info"><div>スコア<b id="sc">0</b></div><div>コンボ<b id="cb">0</b></div><div>最大<b id="mx">0</b></div></div>
<canvas id="c" width="360" height="520"></canvas><div class="msg" id="m">曲と難しさをえらんで、スタート！落ちてくる玉を下のワンコの上でタップ</div>
<div class="row"><select id="sg" class="btn sub"><option value="01">きょく1</option><option value="02">きょく2</option><option value="03">きょく3</option></select><select id="df" class="btn sub"><option value="e">かんたん</option><option value="n" selected>ふつう</option><option value="h">むずかしい</option></select><button class="btn" id="go">スタート</button></div>
<div class="row" style="font-size:12px;font-weight:700">タイミング調整 <input type="range" id="of" min="-200" max="200" step="10" value="0"><span id="ov">0ms</span></div></div><script src="charts.js"></script><script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),W=360,H=520,JY=440,FALL={e:2.0,n:1.6,h:1.25},GAP={e:.5,n:.3,h:.17},TH={e:.12,n:.05,h:0};
const COL=['#ff7a59','#ffd23f','#5ab0ff'],EM=['🦴','🎾','🥎'],DOG=['🐕','🐩','🐕‍🦺'];
let au=new Audio(),notes=[],t0=0,run=false,sc=0,cb=0,mx=0,fx=[],lh=[0,0,0],cnt={p:0,g:0,m:0},total=0;
let OFS=+localStorage.getItem('lab_rh_of')||0;$('of').value=OFS;$('ov').textContent=OFS+'ms';
$('of').oninput=e=>{OFS=+e.target.value;$('ov').textContent=OFS+'ms';localStorage.setItem('lab_rh_of',OFS)};
function build(tid,df){let a=CH[tid].filter(n=>n[2]>=TH[df]&&n[0]>2.5&&n[0]<95),out=[],last=-9,ll=[-9,-9,-9];
 a.forEach(n=>{if(n[0]-last>=GAP[df]&&n[0]-ll[n[1]]>=GAP[df]*1.3){out.push({t:n[0],l:n[1],h:0});last=n[0];ll[n[1]]=n[0]}});return out}
function start(){const tid=$('sg').value,df=$('df').value;notes=build(tid,df);total=notes.length;sc=cb=mx=0;cnt={p:0,g:0,m:0};fx=[];window.FT=FALL[df];
 au.pause();au.src='../../bgm/t'+tid+'.mp3';au.currentTime=0;au.play().then(()=>{run=true;$('m').textContent='がんばれ！';upd()}).catch(()=>{$('m').textContent='音が出せませんでした。もう一度スタートをおしてね'})}
$('go').onclick=start;
function now(){return au.currentTime-OFS/1000}
function upd(){$('sc').textContent=sc;$('cb').textContent=cb;$('mx').textContent=mx}
function laneAt(e){const r=cv.getBoundingClientRect();return Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/r.width*3)))}
cv.onpointerdown=e=>{e.preventDefault();if(!run)return;const l=laneAt(e);lh[l]=performance.now();const t=now();let best=null;notes.forEach(n=>{if(!n.h&&n.l===l){const d=Math.abs(n.t-t);if(d<.16&&(!best||d<Math.abs(best.t-t)))best=n}});
 if(best){best.h=1;const d=Math.abs(best.t-t);if(d<.075){cnt.p++;sc+=300+cb*5;fxAdd(l,'PERFECT','#ff9a00')}else{cnt.g++;sc+=150+cb*2;fxAdd(l,'GOOD','#3aa0e0')}cb++;mx=Math.max(mx,cb);upd()}};
function fxAdd(l,t,c){fx.push({l,t,c,a:1})}
let last=performance.now();
function loop(){if(run){const t=now();notes.forEach(n=>{if(!n.h&&t-n.t>.17){n.h=2;cnt.m++;cb=0;fxAdd(n.l,'MISS','#999');upd()}});
  if(au.ended||(notes.length&&notes.every(n=>n.h)&&t>notes[notes.length-1].t+1)){run=false;au.pause();const acc=total?Math.round((cnt.p+cnt.g*.6)/total*100):0;$('m').textContent=`おわり！スコア${sc} / パーフェクト${cnt.p} グッド${cnt.g} ミス${cnt.m} / ${acc}% `+(acc>=90?'⭐⭐⭐':acc>=70?'⭐⭐':'⭐')}}
 draw();requestAnimationFrame(loop)}
function draw(){x.fillStyle='#fdf0d5';x.fillRect(0,0,W,H);
 for(let l=0;l<3;l++){x.fillStyle=['#ffe4da','#fff3c8','#dcecff'][l];x.fillRect(l*120,0,120,H);x.strokeStyle='rgba(0,0,0,.1)';x.beginPath();x.moveTo(l*120,0);x.lineTo(l*120,H);x.stroke()}
 x.fillStyle='rgba(90,61,43,.55)';x.fillRect(0,JY-3,W,6);x.textAlign='center';x.textBaseline='middle';
 const t=run?now():0,F=window.FT||1.6;
 if(run)notes.forEach(n=>{if(n.h===1)return;const p=(t-(n.t-F))/F;if(p<-.05||p>1.2)return;const y=p*JY;x.globalAlpha=n.h===2?.3:1;x.font='34px serif';x.fillText(EM[n.l],n.l*120+60,y);x.globalAlpha=1});
 for(let l=0;l<3;l++){const hop=Math.max(0,1-(performance.now()-lh[l])/180);x.font='46px serif';x.fillText(DOG[l],l*120+60,JY+44-hop*18)}
 fx=fx.filter(f=>f.a>0);fx.forEach(f=>{x.globalAlpha=f.a;x.fillStyle=f.c;x.font='bold 17px sans-serif';x.fillText(f.t,f.l*120+60,JY-40-(1-f.a)*40);f.a-=.03});x.globalAlpha=1;
 if(cb>=5){x.fillStyle='rgba(90,61,43,.8)';x.font='bold 26px sans-serif';x.fillText(cb+' COMBO',W/2,70)}}
requestAnimationFrame(loop);
</script></body></html>

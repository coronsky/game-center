<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex"><title>【叩き台】ワンコかるた</title><link rel="stylesheet" href="../lab.css"><style>.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kc{background:#fffdf4;border:3px solid #8a5a2c;border-radius:10px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #6a4220}.kc .e{font-size:36px}.kc .k{font-size:15px;color:#a05a2a}.kc.me{background:#d7f0cf;opacity:.5;pointer-events:none}.kc.cp{background:#e0e6ff;opacity:.5;pointer-events:none}.kc.shk{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.rd{font-size:20px;min-height:64px;text-align:center;font-weight:900;padding:10px;background:#fff;border:3px double #8a5a2c;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}</style></head><body><div class="wrap"><div class="top"><a href="../">ラボ</a><h1>ワンコかるた <span class="tag">叩き台</span></h1></div><div class="info"><div>あなた<b id="a">0</b></div><div>ムーン<b id="b">0</b></div><div>のこり<b id="r">12</b></div></div>
<div class="rd" id="rd">スタートをおしてね</div><div class="kg" id="kg"></div><div class="msg" id="m">読み札をよく聞いて、同じ絵の取り札をタッチ！</div><div class="row"><button class="btn" id="go">スタート</button></div></div><script>
const $=id=>document.getElementById(id);
const D=[['あ','🥱','あくびするのは コロンのくせ'],['い','🚶','いっしょにあるく おさんぽみち'],['う','🐕','うれしくて しっぽがぶんぶん'],['え','☀️','えがおでむかえる ムーンのあさ'],['お','🍪','おやつのじかん みみがぴん'],['か','🐩','かわいいおかお ふわふわげ'],['き','⚽','きょうも ボールであそぼうよ'],['く','🌀','くるくるまわる しっぽのさき'],['こ','💕','コロンとムーン なかよしこよし'],['さ','🍚','さんぽのあとは ごはんだよ'],['ほ','🦴','ほねをかじって ごきげんさん'],['ね','😴','ねむいときは ふたりでおひるね']];
let order,idx,me,cp,owner=Array(12).fill(0),live,tm,cpt;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function build(){const g=$('kg');g.innerHTML='';D.forEach((d,i)=>{const e=document.createElement('div');e.className='kc'+(owner[i]===1?' me':owner[i]===2?' cp':'');e.id='k'+i;e.innerHTML=`<span class="e">${d[1]}</span><span class="k">${d[0]}</span>`;e.onclick=()=>tap(i);g.appendChild(e)})}
function start(){order=D.map((_,i)=>i).sort(()=>Math.random()-.5);idx=-1;me=cp=0;owner=Array(12).fill(0);live=false;$('a').textContent=0;$('b').textContent=0;build();next()}
function next(){clearTimeout(tm);clearTimeout(cpt);idx++;$('r').textContent=12-idx;if(idx>=12){live=false;$('rd').textContent='おわり！';$('m').textContent=me>cp?'あなたの勝ち🎉':me<cp?'ムーンの勝ち…':'ひきわけ';return}
 const d=D[order[idx]];live=true;const full=d[2];$('rd').textContent='';say(full);let i=0;const iv=setInterval(()=>{if(!live){clearInterval(iv);return}$('rd').textContent=full.slice(0,++i);if(i>=full.length)clearInterval(iv)},140);
 $('m').textContent='どの札かな？';cpt=setTimeout(()=>{if(live)win(2,order[idx])},3500+Math.random()*4500)}
function win(who,i){if(!live)return;live=false;owner[i]=who;if(who===1)me++;else cp++;$('a').textContent=me;$('b').textContent=cp;build();$('m').textContent=who===1?'とった！⭕':'ムーンがとった！';tm=setTimeout(next,1500)}
function tap(i){if(!live||owner[i])return;if(i===order[idx])win(1,i);else{const e=$('k'+i);e.classList.add('shk');setTimeout(()=>e.classList.remove('shk'),300);$('m').textContent='お手つき！ちがうよ'}}
$('go').onclick=start;build();
</script></body></html>

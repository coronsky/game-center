<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex"><title>【叩き台】パクッとおやつキャッチ</title><link rel="stylesheet" href="../lab.css">
<style>
#cv{width:min(100%,calc((100dvh - 285px)*.6667));margin:0 auto;border:2px solid #e2cfb2;background:#fff}
.tray{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tray button,.tool button{border:2px solid #e2cfb2;background:#fffaf1;border-radius:12px;padding:5px 9px;font:inherit;font-weight:900;font-size:12px;color:#5a3d2b;cursor:pointer}
.tray button b{font-size:15px;margin-left:3px}.tray button:disabled,.tool button:disabled{opacity:.35}
.tool{display:flex;gap:6px;justify-content:center;margin:4px 0}
.bar{font-size:11px;text-align:center;margin:0 0 4px;font-weight:700}.bar b{font-size:14px}#play .msg{min-height:0;font-size:12px;padding:4px 6px;margin-bottom:6px}#play .row{margin:4px 0}#play .row .btn{padding:8px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{aspect-ratio:1;border:2px solid #e2cfb2;background:#fffaf1;border-radius:14px;font:inherit;font-weight:900;font-size:18px;color:#5a3d2b;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grid button small{font-size:10px;color:#e0a100;letter-spacing:-1px}.grid button.done{background:#eef5e6;border-color:#9cc08e}
#res{position:fixed;inset:0;background:rgba(60,40,20,.45);display:none;align-items:center;justify-content:center;z-index:9}
#res .box{background:#fffaf1;border-radius:20px;padding:16px;width:min(320px,90vw);text-align:center;border:3px solid #e2cfb2}
#res .pic{display:flex;align-items:flex-start;gap:8px;justify-content:center;margin:6px 0}
#res img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}#res img.spr{width:104px;height:104px;border-radius:0;border:0;box-shadow:none;object-fit:contain}
#res .bub{position:relative;background:#fff;border:2px solid #f0d58a;border-radius:14px;padding:8px 10px;font-weight:900;font-size:14px;text-align:left;flex:1}
#res .st{font-size:34px;letter-spacing:4px;margin:4px 0;color:#f0b429;text-shadow:0 2px 0 #c58a10}#res .st i{font-style:normal;opacity:.2}
#res .lst{font-size:11px;text-align:left;margin:0 auto 8px;display:inline-block}
</style></head><body><div class="wrap">
<div class="top" style="margin-bottom:4px"><a href="../">ラボ</a><h1>パクッとおやつキャッチ <span class="tag">叩き台</span></h1></div>

<div id="menu"><div class="msg">ステージをえらんでね</div><div class="grid" id="grid"></div>
<p style="font-size:11px;opacity:.75;margin-top:12px">アイテムを置いてから「はっしゃ！」。おやつをはねかえして、ワンコのお口へとどけよう。<br>★1 キャッチ ／ ★2 ほねっこをとる ／ ★3 アイテムを目標の数以内で</p></div>

<div id="play" style="display:none">
<div class="bar">ステージ <b id="sn">1</b>　ちょうせん <b id="tr">0</b>　<span id="goal"></span></div>
<div class="msg" id="m"></div>
<canvas id="cv"></canvas>
<div class="tray"><span id="tray" style="display:contents"></span><button id="rl">↺</button><button id="rr">↻</button><button id="del">🗑</button></div>
<div class="row"><button class="btn" id="go">はっしゃ！</button><button class="btn sub" id="clr">ぜんぶもどす</button><button class="btn sub" id="back">ステージ</button></div>
</div></div>

<div id="res"><div class="box"><div id="rt" style="font-weight:900;font-size:18px">パクッ！</div>
<div class="pic"><img id="rimg" alt=""><div class="bub" id="rb"></div></div>
<div class="st" id="rst"></div><div class="lst" id="rl2"></div>
<div class="row"><button class="btn" id="nx">つぎへ</button><button class="btn sub" id="ag">もういちど</button><button class="btn sub" id="rs">ステージ</button></div></div></div>

<script src="engine.js"></script>
<script>
const {W,H,FLOOR,R,ITEMS,DOG,STAGES,World,itemSeg,dogGeo,REACH}=ENG,$=id=>document.getElementById(id);
const cv=$('cv'),x=cv.getContext('2d'),DPR=Math.min(3,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
const LS=k=>{try{return JSON.parse(localStorage.getItem('lab_oy_'+k))}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem('lab_oy_'+k,JSON.stringify(v))}catch(e){}};
// ワンコの絵（左向き・全スキン共通）：0まち 1あーん 2パクッ 3しょんぼり 4びっくり
const SPR={};for(const k of ['moon','coron']){SPR[k]=[0,1,2,3,4].map(i=>{const im=new Image();im.src='img/'+k+'_'+i+'.webp';return im})}
const sprOK=k=>SPR[k]&&SPR[k].every(im=>im.complete&&im.naturalWidth);let mood='',fastT=0;
let stars=LS('stars30')||[],cur=0,st=null,placed=[],sel=-1,mode=null,drag=null,world=null,lastPath=null,tries=0,state='edit',pops=[],caughtT=0;
const SAY={
 moon:{ok:['パクッ！おいしい〜！','ナイスパス！もっとちょうだい','さすがだね！しっぽふりふり','いいとこに投げてくれたね！'],
  three:['かんぺき！★3つだよ！','天才すぎる…！ムーンびっくり'],fail:['おしい！もういっかい！','つぎはとれるよ！','あとちょっとだったね']},
 coron:{ok:['ジャンプでパクッ！やった〜！','コロンのお口にストライク！','おいし〜！つぎもおねがい！','やるじゃん！'],
  three:['★3つ！すごすぎ〜！','かんぺきなコース！コロンうれしい'],fail:['ドンマイ！もう一回！','コロンまってるよ〜','おしかった〜！']}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const target=()=>st.dogs.find(d=>d.target);

/* ---------- メニュー ---------- */
function menu(){state='menu';$('menu').style.display='';$('play').style.display='none';const g=$('grid');g.innerHTML='';
 STAGES.forEach((s,i)=>{const b=document.createElement('button'),n=stars[i]||0;if(n)b.className='done';
  b.innerHTML=(i+1)+'<small>'+'★'.repeat(n)+'☆'.repeat(3-n)+'</small>';b.onclick=()=>start(i);g.appendChild(b)})}
function start(i){cur=i;st=STAGES[i];placed=[];sel=-1;world=null;lastPath=null;tries=0;state='edit';pops=[];
 $('menu').style.display='none';$('play').style.display='';$('sn').textContent=(i+1)+'/'+STAGES.length;
 $('goal').textContent='目標：★ほねっこ ★アイテム'+st.par+'こ以内';
 msg('「'+st.n+'」 '+st.hint);ui()}
function msg(t){$('m').textContent=t}
function left(k){return(st.items[k]||0)-placed.filter(p=>p.k===k).length}
function ui(){const t=$('tray');t.innerHTML='';const ed=state==='edit';
 for(const k in st.items){const b=document.createElement('button');b.innerHTML=ITEMS[k].e+' '+ITEMS[k].n+'<b>×'+left(k)+'</b>';
  b.disabled=!ed||left(k)<=0;b.onclick=()=>add(k);t.appendChild(b)}
 $('rl').disabled=$('rr').disabled=!ed||sel<0||placed[sel].k==='ball';$('del').disabled=!ed||sel<0;$('go').disabled=!ed;$('clr').disabled=!ed||!placed.length;
 $('tr').textContent=tries}

/* ---------- 置く・動かす ---------- */
function bad(it){const L=st.launch;if(Math.hypot(it.x-L.x,it.y-L.y)<34)return true;
 for(const d of st.dogs){const g=dogGeo(d);if(Math.hypot(it.x-g.hx,it.y-g.hy)<g.hr+14)return true}return false}
function add(k){if(left(k)<=0)return;placed.push({k,x:180,y:150,a:0});sel=placed.length-1;msg(k==='ball'?'ドラッグで動かそう':'ドラッグで動かす・はしの○でまわす');ui()}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function segDist(p,s){const dx=s.x2-s.x1,dy=s.y2-s.y1,l=dx*dx+dy*dy;let t=((p.x-s.x1)*dx+(p.y-s.y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-s.x1-dx*t,p.y-s.y1-dy*t)}
cv.addEventListener('pointerdown',e=>{if(state!=='edit')return;const p=pos(e);mode=null;mood='';
 if(sel>=0&&placed[sel].k!=='ball'){const s=itemSeg(placed[sel]);for(const [ex,ey,flip] of [[s.x1,s.y1,180],[s.x2,s.y2,0]])if(Math.hypot(p.x-ex,p.y-ey)<20){mode='rot';drag={flip};cv.setPointerCapture(e.pointerId);return}}
 let hit=-1,hd=24;placed.forEach((it,i)=>{const d=it.k==='ball'?Math.max(0,Math.hypot(p.x-it.x,p.y-it.y)-ITEMS.ball.r):segDist(p,itemSeg(it));if(d<hd){hd=d;hit=i}});
 sel=hit;if(hit>=0){mode='move';drag={dx:placed[hit].x-p.x,dy:placed[hit].y-p.y};cv.setPointerCapture(e.pointerId)}ui()});
cv.addEventListener('pointermove',e=>{if(!mode||sel<0)return;const p=pos(e),it=placed[sel];
 if(mode==='move'){it.x=Math.max(12,Math.min(W-12,p.x+drag.dx));it.y=Math.max(20,Math.min(FLOOR-8,p.y+drag.dy))}
 else{let a=Math.atan2(-(p.y-it.y),p.x-it.x)*180/Math.PI+drag.flip;it.a=Math.round(a/5)*5}});
cv.addEventListener('pointerup',()=>{mode=null});cv.addEventListener('pointercancel',()=>{mode=null});
$('rl').onclick=()=>{if(sel>=0)placed[sel].a+=15};$('rr').onclick=()=>{if(sel>=0)placed[sel].a-=15};
$('del').onclick=()=>{if(sel>=0){placed.splice(sel,1);sel=-1;ui()}};
$('clr').onclick=()=>{placed=[];sel=-1;ui()};$('back').onclick=menu;

/* ---------- はっしゃ ---------- */
$('go').onclick=()=>{if(placed.some(bad)){msg('赤いアイテムは ワンコや発射機に近すぎるよ');return}
 tries++;sel=-1;state='fly';mood='';world=new World(st,placed.map(p=>({...p})));pops=[];ui();msg('いけ〜！')};
function popAdd(px,py,t){pops.push({x:px,y:py,t,life:1})}
function tick(){if(state==='fly'&&world){for(let i=0;i<4&&!world.res;i++){world.step();
   if(world.msg){const p=world.p;if(world.msg==='bone')popAdd(p.x,p.y-14,'ほねっこゲット！');if(world.msg==='fast'){popAdd(p.x,p.y-14,'はやすぎ〜！');fastT=performance.now()}world.msg=''}}
  if(world.res==='catch'){state='caught';caughtT=performance.now();setTimeout(result,900)}
  else if(world.res){lastPath=world.path.slice();mood='sad';const d=target();msg(world.why+'　'+DOG[d.k].n+'「'+pick(SAY[d.k].fail)+'」');state='edit';ui()}}
 draw();requestAnimationFrame(tick)}
function result(){const got=world.bones.every(b=>b.got),d=target(),n=1+(got?1:0)+(placed.length<=st.par?1:0);
 stars[cur]=Math.max(stars[cur]||0,n);SS('stars30',stars);
 const sp=sprOK(d.k);$('rimg').src=sp?'img/'+d.k+'_2.webp':'../../img/'+(d.k==='moon'?'moon':'colon')+'.webp';$('rimg').className=sp?'spr':'';$('rb').textContent=pick(n===3?SAY[d.k].three:SAY[d.k].ok);
 $('rst').innerHTML='★'+(got?'★':'<i>★</i>')+(placed.length<=st.par?'★':'<i>★</i>');
 $('rl2').innerHTML='✔ キャッチ<br>'+(got?'✔':'✕')+' ほねっこ<br>'+(placed.length<=st.par?'✔':'✕')+' アイテム'+st.par+'こ以内（つかった数 '+placed.length+'）';
 $('nx').style.display=cur<STAGES.length-1?'':'none';$('res').style.display='flex'}
$('nx').onclick=()=>{$('res').style.display='none';start(cur+1)};
$('ag').onclick=()=>{$('res').style.display='none';state='edit';world=null;ui();msg('置きかたを かえてみよう')};
$('rs').onclick=()=>{$('res').style.display='none';menu()};

/* ---------- 描画 ---------- */
function rr(x0,y0,w,h,r){x.beginPath();x.roundRect?x.roundRect(x0,y0,w,h,r):x.rect(x0,y0,w,h)}
function bg(){const g=x.createLinearGradient(0,0,0,FLOOR);g.addColorStop(0,'#fdf6ea');g.addColorStop(1,'#f3e3c8');x.fillStyle=g;x.fillRect(0,0,W,FLOOR);
 x.fillStyle='rgba(214,180,130,.18)';for(let i=0;i<W;i+=30)x.fillRect(i,0,12,FLOOR);
 x.fillStyle='#c99a62';x.fillRect(0,FLOOR,W,H-FLOOR);x.fillStyle='#b5854f';for(let i=0;i<W;i+=48)x.fillRect(i,FLOOR,2,H-FLOOR);
 x.fillStyle='#a8794a';x.fillRect(0,FLOOR,W,3)}
function line(s,col,w){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(s.x1,s.y1);x.lineTo(s.x2,s.y2);x.stroke()}
function drawWall(w){const s={x1:w[0],y1:w[1],x2:w[2],y2:w[3]},th=Math.max(8,(w[4]==null?5:w[4])*2);line(s,'#8a5a32',th+3);line(s,'#b07a47',th)}
function drawItem(it,i){const k=it.k,b=bad(it);
 if(k==='ball'){const r=ITEMS.ball.r;const g=x.createRadialGradient(it.x-5,it.y-6,2,it.x,it.y,r);g.addColorStop(0,'#ff9a9a');g.addColorStop(1,'#e0393e');x.fillStyle=g;x.beginPath();x.arc(it.x,it.y,r,0,7);x.fill();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.arc(it.x,it.y,r-5,3.6,4.6);x.stroke();
  if(b){x.fillStyle='rgba(230,40,40,.35)';x.beginPath();x.arc(it.x,it.y,r+6,0,7);x.fill()}
  if(i===sel&&state==='edit'){x.setLineDash([4,4]);x.strokeStyle='#e08a00';x.lineWidth=2;x.beginPath();x.arc(it.x,it.y,r+5,0,7);x.stroke();x.setLineDash([])}return}
 const s=itemSeg(it);
 if(k==='plank'){line(s,'#7b4f2a',12);line(s,'#d29a5c',9)}
 else if(k==='sponge'){line(s,'#d9a81e',20);line(s,'#ffd84d',16);x.fillStyle='#e8b923';for(let q=.15;q<.9;q+=.17){x.beginPath();x.arc(s.x1+(s.x2-s.x1)*q,s.y1+(s.y2-s.y1)*q+(q*10%2>1?2:-2),2,0,7);x.fill()}}
 else{x.strokeStyle='#555';x.lineWidth=3;const nx=(s.y2-s.y1)/60*12,ny=-(s.x2-s.x1)/60*12;
  for(const [px,py] of [[s.x1,s.y1],[s.x2,s.y2]]){x.beginPath();x.moveTo(px,py);x.lineTo(px-nx,py-ny);x.stroke()}line(s,'#2b6cb0',9);line(s,'#222',5)}
 if(b){line(s,'rgba(230,40,40,.55)',22)}
 if(i===sel&&state==='edit'){x.setLineDash([4,4]);x.strokeStyle='#e08a00';x.lineWidth=2;x.beginPath();x.moveTo(s.x1,s.y1);x.lineTo(s.x2,s.y2);x.stroke();x.setLineDash([]);
  for(const [px,py] of [[s.x1,s.y1],[s.x2,s.y2]]){x.fillStyle='#fff';x.strokeStyle='#e08a00';x.lineWidth=2.5;x.beginPath();x.arc(px,py,8,0,7);x.fill();x.stroke()}}}
function drawLauncher(){const L=st.launch,a=L.a*Math.PI/180;x.save();x.translate(L.x,L.y);
 x.save();x.rotate(-a);x.fillStyle='#4a6342';rr(0,-8,34,16,5);x.fill();x.fillStyle='#38502f';rr(28,-10,8,20,3);x.fill();x.restore();
 x.fillStyle='#6c8a60';x.beginPath();x.arc(0,0,17,0,7);x.fill();x.fillStyle='#fff';x.font='bold 9px sans-serif';x.textAlign='center';x.fillText('おやつ',0,3);
 x.fillStyle='#56705a';x.fillRect(-6,16,12,8);x.restore()}
function bone(bx,by,s,c1,c2){x.save();x.translate(bx,by);x.scale(s,s);x.fillStyle=c1;x.strokeStyle=c2;x.lineWidth=1.5;
 x.beginPath();x.rect(-7,-3,14,6);for(const [cx,cy] of [[-8,-3],[-8,3],[8,-3],[8,3]])x.arc(cx,cy,3.6,0,7);x.fill();x.restore()}
function drawTreat(p,t){x.save();x.translate(p.x,p.y);x.rotate(t*8);x.fillStyle='#a0612d';x.beginPath();x.arc(0,0,R,0,7);x.fill();
 x.fillStyle='#d9a066';for(const [a,b] of [[-2,-2],[3,1],[-1,3]]){x.beginPath();x.arc(a,b,1.3,0,7);x.fill()}x.restore()}
function drawDog(d,near,caught){const k=DOG[d.k],g=dogGeo(d),moon=d.k==='moon';let ox=0,oy=0;
 if(near&&d.target){const dx=near.x-g.mx,dy=near.y-g.my,l=Math.hypot(dx,dy)||1,m=Math.min(REACH,l);ox=dx/l*m;oy=dy/l*m}
 if(sprOK(d.k)){const S=82,fr=caught&&d.target?2:performance.now()-fastT<700&&d.target?4:near&&d.target?1:mood==='sad'&&d.target&&state==='edit'?3:0;
  const jy=d.jy||0;x.save();x.translate(d.x+ox*.4,d.y-jy+oy*.3+S*20/760);if(d.f>0)x.scale(-1,1);x.drawImage(SPR[d.k][fr],-S/2,-S,S,S);x.restore();
  if(d.target&&!caught){x.font='16px sans-serif';x.textAlign='center';x.fillStyle='#e0574f';x.fillText('♡',d.x+d.f*6,d.y-jy-S*.9)}return}
 const col=moon?'#fbfbf8':'#e0a66b',dark=moon?'#e3ded3':'#b8763d';
 // からだ
 x.fillStyle=col;x.strokeStyle=dark;x.lineWidth=2;x.beginPath();x.ellipse(d.x-d.f*6,d.y-16-(d.jy||0)*.3,26,17,0,0,7);x.fill();x.stroke();
 x.beginPath();x.ellipse(d.x-d.f*30,d.y-26-(d.jy||0)*.3,7,5,-d.f*.6,0,7);x.fill();x.stroke();
 x.save();x.translate(g.hx+ox,g.hy+oy);
 if(moon){x.fillStyle=col;for(let i=0;i<14;i++){const a=i/14*Math.PI*2;x.beginPath();x.arc(Math.cos(a)*k.hr*.86,Math.sin(a)*k.hr*.86,k.hr*.32,0,7);x.fill()}
  x.strokeStyle=dark;x.beginPath();x.arc(0,0,k.hr,0,7);x.stroke();x.fillStyle=col;x.beginPath();x.arc(0,0,k.hr-1,0,7);x.fill()}
 else{x.fillStyle=dark;for(const s of [-1,1]){x.beginPath();x.ellipse(s*k.hr*.85,4,8,14,s*.3,0,7);x.fill()}
  x.fillStyle=col;x.beginPath();x.arc(0,0,k.hr,0,7);x.fill();x.fillStyle=dark;for(let i=0;i<5;i++){x.beginPath();x.arc(-10+i*5,-k.hr+3,4,0,7);x.fill()}}
 const fx=d.f*k.hr*.3;x.fillStyle='#2a1a10';for(const s of [-1,1]){x.beginPath();x.arc(fx+s*8,-5,3,0,7);x.fill()}
 x.beginPath();x.ellipse(d.f*k.hr*.55,4,4,3,0,0,7);x.fill();
 const open=caught?0:(near&&d.target?1:0);x.fillStyle=open?'#8a2b2b':'#2a1a10';
 if(open){x.beginPath();x.ellipse(d.f*k.hr*.55,13,6,7,0,0,7);x.fill();x.fillStyle='#f28b8b';x.beginPath();x.ellipse(d.f*k.hr*.55,17,4,3,0,0,7);x.fill()}
 else{x.strokeStyle='#2a1a10';x.lineWidth=1.6;x.beginPath();x.arc(d.f*k.hr*.55-3,9,3,0,Math.PI);x.arc(d.f*k.hr*.55+3,9,3,0,Math.PI);x.stroke()}
 if(caught){x.fillStyle='#f28b8b';x.beginPath();x.arc(fx-10,4,3.5,0,7);x.arc(fx+12,4,3.5,0,7);x.fill()}
 x.restore();
 if(d.target&&!caught){x.font='16px sans-serif';x.textAlign='center';x.fillText('♡',g.hx,g.hy-k.hr-8)}}
function draw(){x.setTransform(DPR,0,0,DPR,0,0);bg();if(!st)return;const w=world&&state!=='edit'?world:null,t=w?w.t:0;
 for(const f of st.fans||[]){x.fillStyle='rgba(120,180,230,.13)';x.fillRect(f.x,f.y,f.w,f.h);x.strokeStyle='rgba(80,140,200,.5)';x.lineWidth=2;
  const dir=Math.sign(f.fx),ph=(performance.now()/12)%40;for(let yy=f.y+20;yy<f.y+f.h;yy+=34)for(let xx=f.x;xx<f.x+f.w;xx+=40){const sx=xx+(dir>0?ph:40-ph);if(sx>f.x+f.w-10)continue;x.beginPath();x.moveTo(sx,yy);x.lineTo(sx+dir*12,yy);x.lineTo(sx+dir*7,yy-4);x.stroke()}
  x.font='22px sans-serif';x.textAlign='center';x.fillText('🌀',dir>0?f.x+14:f.x+f.w-14,f.y+f.h/2+8)}

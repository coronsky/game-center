<script>

 const [Wc,H0,ay]=ISIZE[it.k],cw=m[2]-m[0],ch=m[3]-m[1],Hc=H0||Wc*(ch*im.naturalHeight)/(cw*im.naturalWidth),fw=Wc/cw,fh=Hc/ch;
 x.save();x.translate(it.x,it.y);if(it.k!=='ball')x.rotate(-it.a*Math.PI/180);x.drawImage(im,-Wc/2-m[0]*fw,-ay*Hc-m[1]*fh,fw,fh);x.restore();return true}

const AM={"bg_natural": 0.946, "bg_retro": 0.9453, "bg_neon": 0.9049, "natural_board": [0.003, 0.032, 0.997, 0.968], "retro_board": [0.003, 0.029, 0.997, 0.971], "neon_board": [0.015, 0.164, 0.984, 0.836], "natural_treat": [0.024, 0.024, 0.976, 0.976], "natural_bone": [0.015, 0.015, 0.985, 0.985], "natural_base": [0.013, 0.01, 0.987, 0.99], "natural_nozzle": [0.012, 0.02, 0.988, 0.98], "retro_treat": [0.021, 0.021, 0.979, 0.979], "retro_bone": [0.013, 0.013, 0.987, 0.987], "retro_base": [0.013, 0.01, 0.987, 0.99], "retro_nozzle": [0.012, 0.019, 0.988, 0.981], "neon_treat": [0.125, 0.127, 0.875, 0.873], "neon_bone": [0.093, 0.088, 0.907, 0.912], "neon_base": [0.088, 0.041, 0.912, 0.93], "neon_nozzle": [0.08, 0.122, 0.92, 0.878]},AIMG={};
for(const [sk] of SKINS){for(const n of ['board','treat','bone','base','nozzle']){const im=new Image();im.src='img/'+n+'_'+sk+'.webp';AIMG[sk+'_'+n]=im}const b=new Image();b.src='img/bg_'+sk+'.webp';AIMG['bg_'+sk]=b}

// ワープ・レアおやつの絵
Object.assign(AM,{"natural_warp0": [0.007, 0.007, 0.993, 0.993], "natural_warp1": [0.007, 0.007, 0.993, 0.993], "retro_warp0": [0.007, 0.007, 0.993, 0.993], "retro_warp1": [0.007, 0.007, 0.993, 0.993], "neon_warp0": [0.037, 0.036, 0.963, 0.964], "neon_warp1": [0.037, 0.036, 0.963, 0.964], "natural_rare0": [0.018, 0.017, 0.982, 0.983], "natural_rare1": [0.019, 0.015, 0.981, 0.985], "natural_rare2": [0.015, 0.016, 0.985, 0.984], "natural_rare3": [0.017, 0.014, 0.983, 0.986], "natural_rare4": [0.017, 0.015, 0.983, 0.985], "natural_rare5": [0.015, 0.017, 0.985, 0.983], "retro_rare0": [0.017, 0.017, 0.983, 0.983], "retro_rare1": [0.019, 0.016, 0.981, 0.984], "retro_rare2": [0.016, 0.017, 0.984, 0.983], "retro_rare3": [0.019, 0.015, 0.981, 0.985], "retro_rare4": [0.018, 0.016, 0.982, 0.984], "retro_rare5": [0.015, 0.017, 0.985, 0.983], "neon_rare0": [0.078, 0.076, 0.922, 0.924], "neon_rare1": [0.08, 0.069, 0.92, 0.931], "neon_rare2": [0.07, 0.075, 0.93, 0.925], "neon_rare3": [0.079, 0.067, 0.921, 0.933], "neon_rare4": [0.078, 0.072, 0.922, 0.928], "neon_rare5": [0.069, 0.075, 0.938, 0.925]});
for(const [sk] of SKINS){for(let i=0;i<2;i++){const im=new Image();im.src='img/warp_'+sk+'_'+i+'.webp';AIMG[sk+'_warp'+i]=im}for(let i=0;i<6;i++){const im=new Image();im.src='img/rare_'+sk+'_'+i+'.webp';AIMG[sk+'_rare'+i]=im}}
const aok=k=>{const im=AIMG[k];return im&&im.complete&&im.naturalWidth};
// 本体(core)を (cx,cy) 中心に cw×ch で描く
function drawCore(n,cx,cy,cw,ch,rot,flipY){const k=skin+'_'+n;if(!aok(k))return false;const im=AIMG[k],m=AM[k],fw=cw/(m[2]-m[0]),fh=ch/(m[3]-m[1]);
 x.save();x.translate(cx,cy);if(rot)x.rotate(rot);if(flipY)x.scale(1,-1);x.drawImage(im,-cw/2-m[0]*fw,-ch/2-m[1]*fh,fw,fh);x.restore();return true}
const coreAsp=n=>{const k=skin+'_'+n,im=AIMG[k],m=AM[k];return (m[3]-m[1])*im.naturalHeight/((m[2]-m[0])*im.naturalWidth)};
// たな板：両はしの丸みをのばさない3分割描き
function drawBoard(s,T){const k=skin+'_board';if(!aok(k))return false;const im=AIMG[k],m=AM[k],iw=im.naturalWidth,ih=im.naturalHeight;
 const cy0=m[1]*ih,cy1=m[3]*ih,ch=cy1-cy0,vs=T/ch,cx0=m[0]*iw,cx1=m[2]*iw,cap=Math.min(ch*1.2,(cx1-cx0)/3);
 const L=Math.hypot(s.x2-s.x1,s.y2-s.y1)+T,capD=cap*vs,mid=Math.max(0,L-2*capD),top=-T/2-cy0*vs,full=ih*vs,mg=cx0*vs;
 x.save();x.translate((s.x1+s.x2)/2,(s.y1+s.y2)/2);x.rotate(Math.atan2(s.y2-s.y1,s.x2-s.x1));
 x.drawImage(im,0,0,cx0+cap,ih,-L/2-mg,top,mg+capD,full);
 x.drawImage(im,cx0+cap,0,cx1-cx0-2*cap,ih,-L/2+capD,top,mid,full);
 x.drawImage(im,cx1-cap,0,iw-cx1+cap,ih,L/2-capD,top,capD+(iw-cx1)*vs,full);
 x.restore();return true}
let stars=LS('stars30')||[],cur=0,st=null,placed=[],sel=-1,mode=null,drag=null,world=null,lastPath=null,tries=0,state='edit',pops=[],caughtT=0;
const SAY={
 moon:{ok:['パクッ！おいしい〜！','ナイスパス！もっとちょうだい','さすがだね！しっぽふりふり','いいとこに投げてくれたね！'],
  three:['かんぺき！★3つだよ！','天才すぎる…！ムーンびっくり'],fail:['おしい！もういっかい！','つぎはとれるよ！','あとちょっとだったね']},
 coron:{ok:['ジャンプでパクッ！やった〜！','コロンのお口にストライク！','おいし〜！つぎもおねがい！','やるじゃん！'],
  three:['★3つ！すごすぎ〜！','かんぺきなコース！コロンうれしい'],fail:['ドンマイ！もう一回！','コロンまってるよ〜','おしかった〜！']}};

const target=()=>st.dogs.find(d=>d.target);

/* ---------- メニュー ---------- */
function menu(){state='menu';$('menu').style.display='';$('play').style.display='none';const g=$('grid');g.innerHTML='';
 STAGES.forEach((s,i)=>{if(i===0||i===30){const h=document.createElement('div');h.className='wh';h.textContent=i?'🌀 ワープのせかい（31〜40）':'🍪 はじめてのせかい（1〜30）';g.appendChild(h)}
  const b=document.createElement('button'),n=stars[i]||0;if(n)b.className='done';

/* ---------- 置く・動かす ---------- */
function bad(it){const L=st.launch;if(Math.hypot(it.x-L.x,it.y-L.y)<34)return true;
 for(const d of st.dogs){const g=dogGeo(d);if(Math.hypot(it.x-g.hx,it.y-g.hy)<g.hr+14)return true}

function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function segDist(p,s){const dx=s.x2-s.x1,dy=s.y2-s.y1,l=dx*dx+dy*dy;let t=((p.x-s.x1)*dx+(p.y-s.y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-s.x1-dx*t,p.y-s.y1-dy*t)}
cv.addEventListener('pointerdown',e=>{if(state!=='edit')return;const p=pos(e);mode=null;mood='';
 if(sel>=0&&placed[sel].k!=='ball'){const s=itemSeg(placed[sel]);for(const [ex,ey,flip] of [[s.x1,s.y1,180],[s.x2,s.y2,0]])if(Math.hypot(p.x-ex,p.y-ey)<20){mode='rot';drag={flip};cv.setPointerCapture(e.pointerId);return}}
 let hit=-1,hd=24;placed.forEach((it,i)=>{const d=it.k==='ball'?Math.max(0,Math.hypot(p.x-it.x,p.y-it.y)-ITEMS.ball.r):segDist(p,itemSeg(it));if(d<hd){hd=d;hit=i}});
 sel=hit;if(hit>=0){mode='move';drag={dx:placed[hit].x-p.x,dy:placed[hit].y-p.y};cv.setPointerCapture(e.pointerId)}ui()});
cv.addEventListener('pointermove',e=>{if(!mode||sel<0)return;const p=pos(e),it=placed[sel];

 else{let a=Math.atan2(-(p.y-it.y),p.x-it.x)*180/Math.PI+drag.flip;it.a=Math.round(a/5)*5}});

/* ---------- はっしゃ ---------- */
$('go').onclick=()=>{if(state==='fly'){world.stopped=true;world.end('fail','とめたよ。置きかたを かえてみよう');return}if(state!=='edit')return;if(placed.some(bad)){msg('赤いアイテムは ワンコ・発射機・ワープに近すぎるよ');return}
 tries++;sel=-1;state='fly';mood='';special=Math.random()<.2?pick(SPECIAL):null;world=new World(st,placed.map(p=>({...p})));pops=[];ui();msg(special?'あっ、'+special.n+'だ！いけ〜！':'いけ〜！')};

function popAdd(px,py,t){pops.push({x:px,y:py,t,life:1})}
function tick(){if(state==='fly'&&world){for(let i=0;i<4&&!world.res;i++){world.step();
